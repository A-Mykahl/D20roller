[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d20roller"
version = "0.1.0"
description = "A dice roller supporting standard tabletop RPG notation"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Pillow>=10.0"]

[project.scripts]
d20 = "d20roller.cli:main"
d20-gui = "d20roller.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
